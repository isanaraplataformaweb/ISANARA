    <script>
  /* Entrada suave dos slides */
  (function () {
    var secoes = document.querySelectorAll('.slide');
    if (!('IntersectionObserver' in window)) {
      secoes.forEach(function (s) { s.classList.add('em-tela'); });
      return;
    }
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        entry.target.classList.toggle('em-tela', entry.isIntersecting);
      });
    }, { threshold: 0.1 });
    secoes.forEach(function (s) { observer.observe(s); });
  })();

  /* "E muito mais..." volta ao início e foca o "Comece já" */
  (function () {
    var reduzido = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var mais = document.querySelector('.area--mais');
    var cta = document.querySelector('.area--cta');
    if (!mais) return;
    mais.addEventListener('click', function (e) {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: reduzido ? 'auto' : 'smooth' });
      if (cta) cta.focus({ preventScroll: true });
    });
  })();
</script>
