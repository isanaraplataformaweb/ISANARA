<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Obras</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Segoe UI", sans-serif;
            background: #f5f7fa;
            color: #333;
        }
        .container-galeria {
            max-width: 1200px;
            margin: auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column; 
            gap: 30px;
        }

        .galeria-topo {
            display: flex;
            flex-direction: column;    
            gap: 20px;
            align-items: center;
        }
    
        .galeria-topo h1 {
            font-size: 32px;
            color: #222;
            align-self: flex-start;
        }

        /* Estilo da Barra de Pesquisa de Usuários */
        .barra-pesquisa-container {
            position: relative;
            width: 100%;
            max-width: 100%;
        }
        .barra-pesquisa-container input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 30px;
            border: 1px solid #ddd;
            outline: none;
            font-size: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            background: white;
        }
        .resultados-pesquisa {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            margin-top: 5px;
            max-height: 250px;
            overflow-y: auto;
            z-index: 100;
            display: none;
        }
        .resultado-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 15px;
            text-decoration: none;
            color: #333;
            border-bottom: 1px solid #f1f1f1;
            transition: background .2s;
        }
        .resultado-item:hover {
            background: #f8f9fa;
        }
        .resultado-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            object-fit: cover;
        }

        .card {
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            width: 100%; 
            background: white;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            transition: .3s;
        }

        .btn-publish {
            background: #6c63ff;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 30px;
            font-weight: bold;
            transition: .3s;
            display: block;
        }
        .btn-publish:hover {
            background: #5148d7;
            transform: translateY(-2px);
        }

        .grid-galeria {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
        }
        .obra-card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,.08);
            transition: .3s;
            display: flex;
            flex-direction: column;
        }
        .obra-card:hover {
            transform: translateY(-6px);
        }
        .obra-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
        }
        .obra-card .conteudo {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .obra-card h3 {
            margin-bottom: 8px;
            color: #333;
            font-size: 20px;
        }
        .obra-card .descricao {
            color: #777;
            line-height: 1.6;
            font-size: 15px;
            margin-bottom: 15px;
        }
        .autor-tag {
            font-size: 13px;
            color: #6c63ff;
            font-weight: bold;
            border-top: 1px solid #eee;
            padding-top: 10px;
            margin-top: auto;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .autor-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: cover;
        }

        .status-mensagem {
            grid-column: 1 / -1;
            text-align: center;
            color: #777;
            font-size: 18px;
            padding: 20px 0;
        }

        /* RESPONSIVO MOBILE EXPANDIDO */
        @media(max-width: 768px){            .container-galeria {
                padding: 20px 15px;
            }
            .galeria-topo h1 {
                font-size: 26px;
                align-self: center;
            }
        }
    </style>
    <link rel="stylesheet" href="nav.css">
</head>
<body>

    <!-- BOTÃO DE CRIAÇÃO (+) - EXIBIDO APENAS SE ESTIVER LOGADO -->
    <a href="Opções-criar.html" id="fabCriar" class="btn-criar-fab" aria-label="Criar novo conteúdo" title="Criar">
        <svg viewBox="0 0 24 24">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
    </a>

    <!-- BARRA DE NAVEGAÇÃO LATERAL (INÍCIO, PERFIL, GALERIA, EVENTOS, MATÉRIAS) -->
    <nav class="nav-pill" aria-label="Navegação principal">

        <!-- 1. Início -->
        <a href="index.html" data-label="Início" aria-label="Início">
            <svg viewBox="0 0 24 24">
                <path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z"></path>
            </svg>
        </a>

        <!-- 2. Perfil -->
        <a href="Perfil.html" data-label="Perfil" aria-label="Perfil">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9.5"></circle>
                <circle cx="12" cy="9.5" r="3"></circle>
                <path d="M6.8 18.2c1.3-2.1 3.1-3.2 5.2-3.2s3.9 1.1 5.2 3.2"></path>
            </svg>
        </a>

        <!-- 3. Galeria -->
        <a href="Galeria.html" class="ativo" data-label="Galeria" aria-label="Galeria">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="16" rx="2.5"></rect>
                <circle cx="16.5" cy="9" r="1.5"></circle>
                <path d="M5.5 17l4.5-4.5 3 3 2.5-2.5L18.5 17"></path>
            </svg>
        </a>

        <!-- 4. Eventos -->
        <a href="Eventos.html" data-label="Eventos" aria-label="Eventos">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="5" width="16" height="15" rx="2.5"></rect>
                <line x1="7" y1="3" x2="7" y2="7"></line>
                <line x1="15" y1="3" x2="15" y2="7"></line>
                <line x1="3" y1="10" x2="19" y2="10"></line>
                <path d="M16 17l2 2 4-4"></path>
            </svg>
        </a>

        <!-- 5. Matérias -->
        <a href="Materias.html" data-label="Matérias" aria-label="Matérias">
            <svg viewBox="0 0 24 24">
                <polygon points="12 3 21 7.5 12 12 3 7.5 12 3"></polygon>
                <polyline points="3 11.5 12 16 21 11.5"></polyline>
                <polyline points="3 15.5 12 20 21 15.5"></polyline>
            </svg>
        </a>

        <!-- 6. Sair (apenas usuários logados) -->
        <a href="#" id="logoutBtn" class="nav-logout" data-label="Sair" aria-label="Sair">
            <svg viewBox="0 0 24 24">
                <path d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5"></path>
                <polyline points="15 8 19 12 15 16"></polyline>
                <line x1="19" y1="12" x2="9" y2="12"></line>
            </svg>
        </a>
    </nav>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="container-galeria">
        <div class="galeria-topo">
            <h1>Galeria de Arte</h1>
            
            <!-- Barra de Pesquisa de Usuários -->
            <div class="barra-pesquisa-container">
                <input type="text" id="inputPesquisaPerfil" placeholder="🔍 Pesquisar perfis de artistas..." autocomplete="off">
                <div id="resultadosPesquisa" class="resultados-pesquisa"></div>
            </div>
            
            <div class="card">
                <a href="Postar-Obra.html" class="btn-publish">Publicar Nova Obra</a>
                <a href="Postar-evento.html" class="btn-publish">Publicar Novo Lembrete</a>
                <a href="Postar-Matéria.html" class="btn-publish">Publicar Nova Matéria</a>
                <a href="Eventos.html" class="btn-publish">Ver Eventos e Lembretes</a>
                <a href="Materias.html" class="btn-publish">Ver Matérias Disponíveis</a>
            </div>
        </div>

        <div id="gridGaleriaPublica" class="grid-galeria">
            <p class="status-mensagem">Carregando galeria de arte...</p>
        </div>
    </main>

   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://zwgrjmsycbplokliovsg.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3Z3JqbXN5Y2JwbG9rbGlvdnNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzODM1OTEsImV4cCI6MjA5OTk1OTU5MX0.KIKQ9QjspCik0QY6TGoT_mHcsK3Y_IeXcmqUo0cVhw4'; 
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  document.addEventListener('DOMContentLoaded', async () => {
    const galeriaContainer = document.getElementById('gridGaleriaPublica');

    const { data: obras, error } = await supabaseClient
      .from('obras')
      .select(`
        id,
        titulo,
        descricao,
        imagem_url,
        created_at,
        perfis (
          id,
          nome,
          foto_perfil
        )
      `)
      .order('created_at', { ascending: false });

    if (error) {
      galeriaContainer.innerHTML = `<p class="status-mensagem">Erro ao carregar galeria: ${error.message}</p>`;
      return;
    }

    if (!obras || obras.length === 0) {
      galeriaContainer.innerHTML = '<p class="status-mensagem">Nenhuma obra cadastrada ainda.</p>';
      return;
    }

    galeriaContainer.innerHTML = '';
    
    obras.forEach(obra => {
      const autor = obra.perfis || { id: '', nome: 'Artista Anônimo', foto_perfil: 'https://via.placeholder.com/40' };
      
      const cardHTML = `
        <div class="obra-card" onclick="window.location.href='Obras.html?id=${obra.id}'" style="cursor:pointer;">
          <img src="${obra.imagem_url}" alt="${obra.titulo}">
          <div class="conteudo">
            <h3>${obra.titulo}</h3>
            <p class="descricao">${obra.descricao || ''}</p>
            <div class="autor-tag" onclick="event.stopPropagation(); window.location.href='Perfil-Publico.html?id=${autor.id}'" style="cursor:pointer;">
              <img src="${autor.foto_perfil || 'https://via.placeholder.com/40'}" class="autor-avatar" alt="Avatar">
              <span>${autor.nome}</span>
            </div>
          </div>
        </div>
      `;
      galeriaContainer.innerHTML += cardHTML;
    });

    // Lógica da Barra de Pesquisa de Usuários
    const inputPesquisa = document.getElementById('inputPesquisaPerfil');
    const containerResultados = document.getElementById('resultadosPesquisa');

    inputPesquisa.addEventListener('input', async (e) => {
      const termo = e.target.value.trim();
      if (termo.length < 2) {
        containerResultados.style.display = 'none';
        containerResultados.innerHTML = '';
        return;
      }

      const { data: perfis, error: errPerfil } = await supabaseClient
        .from('perfis')
        .select('id, nome, foto_perfil')
        .ilike('nome', `%${termo}%`)
        .limit(5);

      if (errPerfil || !perfis || perfis.length === 0) {
        containerResultados.style.display = 'block';
        containerResultados.innerHTML = '<div style="padding: 10px; font-size: 14px; color: #777; text-align: center;">Nenhum perfil encontrado</div>';
        return;
      }

      containerResultados.style.display = 'block';
      containerResultados.innerHTML = '';
      perfis.forEach(perfil => {
        containerResultados.innerHTML += `
          <a href="Perfil-Publico.html?id=${perfil.id}" class="resultado-item">
            <img src="${perfil.foto_perfil || 'https://via.placeholder.com/35'}" class="resultado-avatar">
            <span style="font-weight: 600; font-size: 14px;">${perfil.nome}</span>
          </a>
        `;
      });
    });

    // Fechar resultados ao clicar fora
    document.addEventListener('click', (e) => {
      if (!inputPesquisa.contains(e.target) && !containerResultados.contains(e.target)) {
        containerResultados.style.display = 'none';
      }
    });
  });
</script>

<script src="nav.js"></script>
</body>
</html>
