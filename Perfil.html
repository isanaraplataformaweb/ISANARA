<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", sans-serif;
            background: #f5f7fa;
            color: #333;
        }
        
        header {
            width: 100%;
            height: 80px;
            background: linear-gradient(135deg, #081c3d 0%, #1e5eff 45%, #b46cff 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,.08);
            position: sticky;
            top: 0;
            z-index: 999;
        }

        header img {
            height: 40px;
            width: auto;
            mix-blend-mode: screen;
        }

        nav {
            display: flex;
            gap: 35px;
            margin: auto;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 18px;
            transition: .3s;
            position: relative;
        }

        nav a::after {
            content: "";
            position: absolute;
            width: 0%;
            height: 3px;
            left: 0;
            bottom: -5px;
            background: white;
            transition: .3s;
        }

        nav a:hover::after {
            width: 100%;
        }

        nav a.ativo {
            color: #ffffff;
        }

        nav a.ativo::after {
            content: "";
            width: 100%;
            height: 2px;
            background: #fbfbfb;
            position: absolute;
            left: 0;
            bottom: -10px;
            border-radius: 5px;
        }

        .capa {
            width: 100%;
            height: 320px;
            overflow: hidden;
            background: #ddd;
        }

        .capa img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .perfil {
            max-width: 1200px;
            margin: auto;
            padding: 40px;
        }

        .perfil-topo {
            display: flex;
            align-items: center;
            gap: 40px;
            margin-top: -120px;
            margin-bottom: 40px;
        }

        .foto-perfil {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            object-fit: cover;
            border: 8px solid white;
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,.15);
        }

        .informacoes {
            flex: 1;
        }

        .informacoes h1 {
            font-size: 36px;
            color: #222;
            margin-bottom: 15px;
        }

        .informacoes p {
            font-size: 17px;
            line-height: 1.7;
            color: #666;
            margin-bottom: 20px;
        }

        .localizacao {
            color: #777;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .redes {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .redes a {
            text-decoration: none;
            background: #6c63ff;
            color: white;
            padding: 10px 18px;
            border-radius: 30px;
            transition: .3s;
            font-weight: 600;
        }

        .redes a:hover {
            background: #4d45d6;
        }

        .estatisticas {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin: 50px 0;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,.08);
            transition: .3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h2 {
            color: #6c63ff;
            font-size: 42px;
            margin-bottom: 10px;
        }

        .card p {
            color: #666;
            font-size: 18px;
        }
    
        .acoes {
            display: flex;
            justify-content: center;
            margin-bottom: 50px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn-editar {
            background: #6c63ff;
            color: white;
            text-decoration: none;
            padding: 15px 40px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: bold;
            transition: .3s;
            display: inline-block;
            text-align: center;
        }

        .btn-editar:hover {
            background: #5148d7;
            transform: scale(1.05);
        }

        .obras-cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .obras h2 {
            color: #333;
            font-size: 30px;
        }
        
        .grid-obras {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .obra-card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,.08);
            transition: .3s;
        }

        .obra-card:hover {
            transform: translateY(-6px);
        }

        .obra-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .obra-card .conteudo {
            padding: 20px;
        }

        .obra-card h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .obra-card p {
            color: #777;
            line-height: 1.6;
        }

        /* RESPONSIVIDADE PARA SMARTPHONES (MELHORADA) */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                height: auto;
                padding: 15px;
                gap: 15px;
            }

            nav {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
                margin: 0;
            }

            nav a {
                font-size: 15px;
            }

            nav a.ativo::after {
                bottom: -5px;
            }

            .capa {
                height: 200px;
            }

            .perfil {
                padding: 20px;
            }

            .perfil-topo {
                flex-direction: column;
                text-align: center;
                margin-top: -90px;
                gap: 20px;
            }

            .foto-perfil {
                width: 160px;
                height: 160px;
                border-width: 5px;
            }

            .informacoes h1 {
                font-size: 28px;
            }

            .redes {
                justify-content: center;
            }

            .estatisticas {
                grid-template-columns: 1fr;
                gap: 15px;
                margin: 30px 0;
            }

            .card {
                padding: 20px;
            }

            .card h2 {
                font-size: 32px;
            }

            .acoes {
                flex-direction: column;
                width: 100%;
            }

            .btn-editar {
                width: 100%;
                padding: 12px 20px;
                font-size: 16px;
            }

            .obras-cabecalho {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
        }
    </style>
</head>

<body>
    <header>
        <a href="Index.html">
            <img src="1.png" alt="Logo da sua empresa">
        </a>
        <nav>
            <a href="Index.html">Início</a>
            <a href="Galeria.html">Galeria</a>
            <a href="Perfil.html" class="ativo">Perfil</a>
            <a href="Comunicações.html">Comunicações</a>
        </nav>
    </header>

    <section class="capa">
        <img id="fotoCapa" src="https://via.placeholder.com/1200x320" alt="Foto de capa">
    </section>

    <!-- PERFIL -->
    <main class="perfil">
        <section class="perfil-topo">
            <img id="fotoPerfil" class="foto-perfil" src="https://via.placeholder.com/220" alt="Foto do usuário">
            
            <div class="informacoes">
                <h1 id="nomeUsuario">Carregando...</h1>
                <p id="biografia">Carregando informações...</p>
                <div class="localizacao">
                    <span id="cidade">Cidade</span> • <span id="pais">País</span>
                </div>
                <div class="redes">
                    <a id="instagram" href="#" target="_blank">Instagram</a>
                    <a id="site" href="#" target="_blank">Site</a>
                </div>
            </div>
        </section>

        <!-- ESTATÍSTICAS -->
        <section class="estatisticas">
            <div class="card">
                <h2 id="quantidadeObras">0</h2>
                <p>Obras</p>
            </div>
            <div class="card">
                <h2 id="seguidores">0</h2>
                <p>Seguidores</p>
            </div>
            <div class="card">
                <h2 id="seguindo">0</h2>
                <p>Seguindo</p>
            </div>
        </section>

        <section class="acoes" id="secaoAcoes">
            <a href="Perfil-edit.html" class="btn-editar">Editar Perfil</a>
            <a href="Painel-estatisticas.html" class="btn-editar">Meu Painel</a>
        </section>

        <section class="obras">
            <div class="obras-cabecalho">
                <h2>Obras Publicadas</h2>
                <a href="Opções-criar.html" class="btn-editar" id="btnCriarObra">Criar +</a>
            </div>
            <div id="listaObras" class="grid-obras"></div>
        </section>
    </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://zwgrjmsycbplokliovsg.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3Z3JqbXN5Y2JwbG9rbGlvdnNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzODM1OTEsImV4cCI6MjA5OTk1OTU5MX0.KIKQ9QjspCik0QY6TGoT_mHcsK3Y_IeXcmqUo0cVhw4'; 
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  document.addEventListener('DOMContentLoaded', async () => {
    const urlParams = new URLSearchParams(window.location.search);
    let targetUserId = urlParams.get('id');

    const { data: authData } = await supabaseClient.auth.getUser();
    const user = authData?.user;

    if (!targetUserId) {
      if (!user) {
        window.location.href = 'Login.html';
        return;
      }
      targetUserId = user.id; 
    }

    // 1. Buscar dados do perfil
    const { data: perfil, error: perfilError } = await supabaseClient
      .from('perfis')
      .select('*')
      .eq('id', targetUserId)
      .single();

    if (perfilError) {
      console.error('Erro ao buscar perfil:', perfilError);
      document.getElementById('nomeUsuario').textContent = 'Usuário não encontrado';
      document.getElementById('biografia').textContent = '';
    } else if (perfil) {
      document.getElementById('nomeUsuario').textContent = perfil.nome || 'Usuário Sem Nome';
      document.getElementById('biografia').textContent = perfil.biografia || 'Sem biografia cadastrada.';
      
      document.getElementById('cidade').textContent = perfil.cidade || 'Cidade não informada';
      document.getElementById('pais').textContent = perfil.pais || 'País não informado';
      
      const linkInsta = document.getElementById('instagram');
      if (perfil.instagram) {
          linkInsta.href = `https://instagram.com/${perfil.instagram.replace('@', '')}`;
          linkInsta.style.display = 'inline-block';
      } else {
          linkInsta.style.display = 'none';
      }

      const linkSite = document.getElementById('site');
      if (perfil.site) {
          linkSite.href = perfil.site;
          linkSite.style.display = 'inline-block';
      } else {
          linkSite.style.display = 'none';
      }

      if (perfil.foto_perfil) {
          document.getElementById('fotoPerfil').src = perfil.foto_perfil;
      }
      if (perfil.foto_capa) {
          document.getElementById('fotoCapa').src = perfil.foto_capa;
      }
    }

    // 2. Buscar e renderizar as Obras Publicadas deste usuário
    const { data: obras, error: obrasError } = await supabaseClient
      .from('obras')
      .select('*')
      .eq('user_id', targetUserId);

    const listaObrasDiv = document.getElementById('listaObras');
    const quantidadeObrasH2 = document.getElementById('quantidadeObras');

    if (!obrasError && obras) {
      quantidadeObrasH2.textContent = obras.length;
      
      if (obras.length === 0) {
        listaObrasDiv.innerHTML = '<p style="color: #777; grid-column: 1 / -1; text-align: center;">Nenhuma obra publicada ainda.</p>';
      } else {
        listaObrasDiv.innerHTML = '';
        obras.forEach(obra => {
          const titulo = obra.titulo || 'Obra sem título';
          const descricao = obra.descricao || '';
          const imagem = obra.imagem_url || 'https://via.placeholder.com/280x220';

          const card = document.createElement('div');
          card.className = 'obra-card';
          card.innerHTML = `
            <img src="${imagem}" alt="${titulo}">
            <div class="conteudo">
              <h3>${titulo}</h3>
              <p>${descricao}</p>
            </div>
          `;
          listaObrasDiv.appendChild(card);
        });
      }
    } else {
      quantidadeObrasH2.textContent = '0';
      listaObrasDiv.innerHTML = '<p style="color: #777; grid-column: 1 / -1; text-align: center;">Erro ao carregar as obras.</p>';
    }

    // 3. Buscar contagem de Seguidores e Seguindo
    const { count: totalSeguidores } = await supabaseClient
      .from('seguidores')
      .select('*', { count: 'exact', head: true })
      .eq('seguindo_id', targetUserId);

    const { count: totalSeguindo } = await supabaseClient
      .from('seguidores')
      .select('*', { count: 'exact', head: true })
      .eq('seguidor_id', targetUserId);

    document.getElementById('seguidores').textContent = totalSeguidores || 0;
    document.getElementById('seguindo').textContent = totalSeguindo || 0;
  });
</script>

</body>
</html>
