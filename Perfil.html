<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>

    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", sans-serif;
            background: #f5f7fa;
            color: #333;
            overflow-x: hidden;
        }

        /* BOTÃO FLUTUANTE DE CRIAÇÃO (+) - APENAS USUÁRIO LOGADO */
        .btn-criar-fab {
            position: fixed;
            top: 22px;
            left: 24px;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: #09090b;
            color: #ffffff;
            display: none; /* Controlado via JS conforme autenticação */
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
            z-index: 1001;
            transition: transform 0.25s ease, background 0.25s ease;
        }

        .btn-criar-fab:hover {
            transform: scale(1.07);
            background: #18181b;
        }

        .btn-criar-fab svg {
            width: 26px;
            height: 26px;
            stroke: currentColor;
            stroke-width: 3;
            stroke-linecap: round;
        }

        /* BARRA DE NAVEGAÇÃO LATERAL EM PÍLULA */
        .nav-pill {
            position: fixed;
            top: 90px;
            left: 24px;
            width: 54px;
            padding: 18px 0;
            border-radius: 999px;
            background: #070709;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
            z-index: 1000;
        }

        .nav-pill a {
            position: relative;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            color: #ff3b9a;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
        }

        .nav-pill a:hover {
            transform: scale(1.1);
            background: rgba(255, 59, 154, 0.14);
        }

        .nav-pill a.ativo {
            background: rgba(255, 59, 154, 0.2);
            color: #ff5cae;
        }

        /* Ícone de logout - exibido apenas para usuários autenticados */
        .nav-pill .nav-logout {
            display: none;
        }

        .nav-pill a svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.1;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Tooltip discreto ao passar o mouse no desktop */
        .nav-pill a::after {
            content: attr(data-label);
            position: absolute;
            left: 48px;
            top: 50%;
            transform: translateY(-50%) translateX(-4px);
            background: #09090b;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 8px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .nav-pill a:hover::after {
            opacity: 1;
            transform: translateY(-50%) translateX(0);
        }

        .capa {
            width: 100%;
            height: 320px;
            overflow: hidden;
            background: #ddd;
        }

        .capa img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .perfil {
            max-width: 1200px;
            margin: auto;
            padding: 40px 40px 40px 105px;
        }

        .perfil-topo {
            display: flex;
            align-items: center;
            gap: 40px;
            margin-top: -120px;
            margin-bottom: 40px;
        }

        .foto-perfil {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            object-fit: cover;
            border: 8px solid white;
            background: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .15);
        }

        .informacoes {
            flex: 1;
        }

        .informacoes h1 {
            font-size: 36px;
            color: #222;
            margin-bottom: 15px;
        }

        .informacoes p {
            font-size: 17px;
            line-height: 1.7;
            color: #666;
            margin-bottom: 20px;
        }

        .localizacao {
            color: #777;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .redes {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .redes a {
            text-decoration: none;
            background: #6c63ff;
            color: white;
            padding: 10px 18px;
            border-radius: 30px;
            transition: .3s;
            font-weight: 600;
        }

        .redes a:hover {
            background: #4d45d6;
        }

        .estatisticas {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin: 50px 0;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .08);
            transition: .3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h2 {
            color: #6c63ff;
            font-size: 42px;
            margin-bottom: 10px;
        }

        .card p {
            color: #666;
            font-size: 18px;
        }

        .acoes {
            display: flex;
            justify-content: center;
            margin-bottom: 50px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn-editar {
            background: #6c63ff;
            color: white;
            text-decoration: none;
            padding: 15px 40px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: bold;
            transition: .3s;
            display: inline-block;
            text-align: center;
        }

        .btn-editar:hover {
            background: #5148d7;
            transform: scale(1.05);
        }

        .obras-cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .obras h2 {
            color: #333;
            font-size: 30px;
        }

        .grid-obras {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .obra-card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .08);
            transition: .3s;
        }

        .obra-card:hover {
            transform: translateY(-6px);
        }

        .obra-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .obra-card .conteudo {
            padding: 20px;
        }

        .obra-card h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .obra-card p {
            color: #777;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .btn-criar-fab {
                top: 14px;
                left: 14px;
                width: 46px;
                height: 46px;
            }

            .nav-pill {
                top: 70px;
                left: 14px;
                width: 46px;
                padding: 14px 0;
                gap: 18px;
            }

            .nav-pill a {
                width: 34px;
                height: 34px;
            }

            .nav-pill a svg {
                width: 19px;
                height: 19px;
            }

            .nav-pill a::after {
                display: none;
            }

            .capa {
                height: 200px;
            }

            .perfil {
                padding: 20px 16px 32px 72px;
            }

            .perfil-topo {
                flex-direction: column;
                text-align: center;
                margin-top: -90px;
                gap: 20px;
            }

            .foto-perfil {
                width: 150px;
                height: 150px;
                border-width: 5px;
            }

            .informacoes h1 {
                font-size: 28px;
            }

            .redes {
                justify-content: center;
            }

            .estatisticas {
                grid-template-columns: 1fr;
                gap: 15px;
                margin: 30px 0;
            }

            .card {
                padding: 20px;
            }

            .card h2 {
                font-size: 32px;
            }

            .acoes {
                flex-direction: column;
                width: 100%;
            }

            .btn-editar {
                width: 100%;
                padding: 12px 20px;
                font-size: 16px;
            }

            .obras-cabecalho {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
        }
    </style>
</head>

<body>
    <!-- BOTÃO DE CRIAÇÃO (+) - EXIBIDO APENAS SE ESTIVER LOGADO -->
    <a href="Opções-criar.html" id="fabCriar" class="btn-criar-fab" aria-label="Criar novo conteúdo" title="Criar">
        <svg viewBox="0 0 24 24">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
    </a>

    <!-- BARRA DE NAVEGAÇÃO LATERAL (INÍCIO, PERFIL, GALERIA, EVENTOS, MATÉRIAS) -->
    <nav class="nav-pill" aria-label="Navegação principal">
        <!-- 1. Início -->
        <a href="index.html" data-label="Início" aria-label="Início">
            <svg viewBox="0 0 24 24">
                <path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z"></path>
            </svg>
        </a>

        <!-- 2. Perfil -->
        <a href="Perfil.html" class="ativo" data-label="Perfil" aria-label="Perfil">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9.5"></circle>
                <circle cx="12" cy="9.5" r="3"></circle>
                <path d="M6.8 18.2c1.3-2.1 3.1-3.2 5.2-3.2s3.9 1.1 5.2 3.2"></path>
            </svg>
        </a>

        <!-- 3. Galeria -->
        <a href="Galeria.html" data-label="Galeria" aria-label="Galeria">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="16" rx="2.5"></rect>
                <circle cx="16.5" cy="9" r="1.5"></circle>
                <path d="M5.5 17l4.5-4.5 3 3 2.5-2.5L18.5 17"></path>
            </svg>
        </a>

        <!-- 4. Eventos -->
        <a href="Eventos.html" data-label="Eventos" aria-label="Eventos">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="5" width="16" height="15" rx="2.5"></rect>
                <line x1="7" y1="3" x2="7" y2="7"></line>
                <line x1="15" y1="3" x2="15" y2="7"></line>
                <line x1="3" y1="10" x2="19" y2="10"></line>
                <path d="M16 17l2 2 4-4"></path>
            </svg>
        </a>

        <!-- 5. Matérias -->
        <a href="Materias.html" data-label="Matérias" aria-label="Matérias">
            <svg viewBox="0 0 24 24">
                <polygon points="12 3 21 7.5 12 12 3 7.5 12 3"></polygon>
                <polyline points="3 11.5 12 16 21 11.5"></polyline>
                <polyline points="3 15.5 12 20 21 15.5"></polyline>
            </svg>
        </a>

        <!-- 6. Sair (apenas usuários logados) -->
        <a href="#" id="logoutBtn" class="nav-logout" data-label="Sair" aria-label="Sair">
            <svg viewBox="0 0 24 24">
                <path d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5"></path>
                <polyline points="15 8 19 12 15 16"></polyline>
                <line x1="19" y1="12" x2="9" y2="12"></line>
            </svg>
        </a>
    </nav>

    <section class="capa">
        <img id="fotoCapa" src="https://via.placeholder.com/1200x320" alt="Foto de capa">
    </section>

    <!-- PERFIL -->
    <main class="perfil">
        <section class="perfil-topo">
            <img id="fotoPerfil" class="foto-perfil" src="https://via.placeholder.com/220" alt="Foto do usuário">

            <div class="informacoes">
                <h1 id="nomeUsuario">Carregando...</h1>
                <p id="biografia">Carregando informações...</p>
                <div class="localizacao">
                    <span id="cidade">Cidade</span> • <span id="pais">País</span>
                </div>
                <div class="redes">
                    <a id="instagram" href="#" target="_blank">Instagram</a>
                    <a id="site" href="#" target="_blank">Site</a>
                </div>
            </div>
        </section>

        <!-- ESTATÍSTICAS -->
        <section class="estatisticas">
            <div class="card">
                <h2 id="quantidadeObras">0</h2>
                <p>Obras</p>
            </div>
            <div class="card">
                <h2 id="seguidores">0</h2>
                <p>Seguidores</p>
            </div>
            <div class="card">
                <h2 id="seguindo">0</h2>
                <p>Seguindo</p>
            </div>
        </section>

        <section class="acoes" id="secaoAcoes">
            <a href="Perfil-edit.html" class="btn-editar">Editar Perfil</a>
            <a href="Painel-estatisticas.html" class="btn-editar">Meu Painel</a>
        </section>

        <section class="obras">
            <div class="obras-cabecalho">
                <h2>Obras Publicadas</h2>
                <a href="Opções-criar.html" class="btn-editar" id="btnCriarObra">Criar +</a>
            </div>
            <div id="listaObras" class="grid-obras"></div>
        </section>
    </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://zwgrjmsycbplokliovsg.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3Z3JqbXN5Y2JwbG9rbGlvdnNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzODM1OTEsImV4cCI6MjA5OTk1OTU5MX0.KIKQ9QjspCik0QY6TGoT_mHcsK3Y_IeXcmqUo0cVhw4';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function atualizarVisibilidadeBotaoCriar(user) {
    const fabCriar = document.getElementById('fabCriar');
    const btnCriarObra = document.getElementById('btnCriarObra');
    const logoutBtn = document.getElementById('logoutBtn');

    if (user) {
      fabCriar.style.display = 'flex';
      if (btnCriarObra) btnCriarObra.style.display = 'inline-block';
      if (logoutBtn) logoutBtn.style.display = 'flex';
    } else {
      fabCriar.style.display = 'none';
      if (btnCriarObra) btnCriarObra.style.display = 'none';
      if (logoutBtn) logoutBtn.style.display = 'none';
    }
  }

  document.addEventListener('DOMContentLoaded', async () => {
    const fabCriar = document.getElementById('fabCriar');
    const urlParams = new URLSearchParams(window.location.search);
    let targetUserId = urlParams.get('id');

    const { data: authData } = await supabaseClient.auth.getUser();
    let currentUser = authData?.user || null;

    atualizarVisibilidadeBotaoCriar(currentUser);

    // Mantém a visibilidade sincronizada caso a sessão mude
    supabaseClient.auth.onAuthStateChange((_event, session) => {
      currentUser = session?.user || null;
      atualizarVisibilidadeBotaoCriar(currentUser);
    });

    // Bloqueia acesso direto via clique caso o usuário não esteja autenticado
    fabCriar.addEventListener('click', async (e) => {
      e.preventDefault();
      const { data: freshAuth } = await supabaseClient.auth.getUser();
      if (!freshAuth?.user) {
        window.location.href = 'Login.html';
        return;
      }
      window.location.href = fabCriar.href;
    });

    // Encerra a sessão e volta para a tela de login
    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        await supabaseClient.auth.signOut();
        window.location.href = 'Login.html';
      });
    }

    if (!targetUserId) {
      if (!currentUser) {
        window.location.href = 'Login.html';
        return;
      }
      targetUserId = currentUser.id;
    }

    // 1. Buscar dados do perfil
    const { data: perfil, error: perfilError } = await supabaseClient
      .from('perfis')
      .select('*')
      .eq('id', targetUserId)
      .single();

    if (perfilError) {
      console.error('Erro ao buscar perfil:', perfilError);
      document.getElementById('nomeUsuario').textContent = 'Usuário não encontrado';
      document.getElementById('biografia').textContent = '';
    } else if (perfil) {
      document.getElementById('nomeUsuario').textContent = perfil.nome || 'Usuário Sem Nome';
      document.getElementById('biografia').textContent = perfil.biografia || 'Sem biografia cadastrada.';

      document.getElementById('cidade').textContent = perfil.cidade || 'Cidade não informada';
      document.getElementById('pais').textContent = perfil.pais || 'País não informado';

      const linkInsta = document.getElementById('instagram');
      if (perfil.instagram) {
        linkInsta.href = `https://instagram.com/${perfil.instagram.replace('@', '')}`;
        linkInsta.style.display = 'inline-block';
      } else {
        linkInsta.style.display = 'none';
      }

      const linkSite = document.getElementById('site');
      if (perfil.site) {
        linkSite.href = perfil.site;
        linkSite.style.display = 'inline-block';
      } else {
        linkSite.style.display = 'none';
      }

      if (perfil.foto_perfil) {
        document.getElementById('fotoPerfil').src = perfil.foto_perfil;
      }
      if (perfil.foto_capa) {
        document.getElementById('fotoCapa').src = perfil.foto_capa;
      }
    }

    // 2. Buscar e renderizar as Obras Publicadas deste usuário
    const { data: obras, error: obrasError } = await supabaseClient
      .from('obras')
      .select('*')
      .eq('user_id', targetUserId);

    const listaObrasDiv = document.getElementById('listaObras');
    const quantidadeObrasH2 = document.getElementById('quantidadeObras');

    if (!obrasError && obras) {
      quantidadeObrasH2.textContent = obras.length;

      if (obras.length === 0) {
        listaObrasDiv.innerHTML = '<p style="color: #777; grid-column: 1 / -1; text-align: center;">Nenhuma obra publicada ainda.</p>';
      } else {
        listaObrasDiv.innerHTML = '';
        obras.forEach(obra => {
          const titulo = obra.titulo || 'Obra sem título';
          const descricao = obra.descricao || '';
          const imagem = obra.imagem_url || 'https://via.placeholder.com/280x220';

          const card = document.createElement('div');
          card.className = 'obra-card';
          card.innerHTML = `
            <img src="${imagem}" alt="${titulo}">
            <div class="conteudo">
              <h3>${titulo}</h3>
              <p>${descricao}</p>
            </div>
          `;
          listaObrasDiv.appendChild(card);
        });
      }
    } else {
      quantidadeObrasH2.textContent = '0';
      listaObrasDiv.innerHTML = '<p style="color: #777; grid-column: 1 / -1; text-align: center;">Erro ao carregar as obras.</p>';
    }

    // 3. Buscar contagem de Seguidores e Seguindo
    const { count: totalSeguidores } = await supabaseClient
      .from('seguidores')
      .select('*', { count: 'exact', head: true })
      .eq('seguindo_id', targetUserId);

    const { count: totalSeguindo } = await supabaseClient
      .from('seguidores')
      .select('*', { count: 'exact', head: true })
      .eq('seguidor_id', targetUserId);

    document.getElementById('seguidores').textContent = totalSeguidores || 0;
    document.getElementById('seguindo').textContent = totalSeguindo || 0;
  });
</script>

</body>
</html>
