<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil - ISANARA</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
        }

        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            background: linear-gradient(135deg, #081c3d 0%, #691eff 45%, #71c6f1 100%);
            background-size: cover;
            background-attachment: fixed;
            color: #333; 
            padding: 20px;
        }

        .container-editar { 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 35px 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25); 
            width: 100%;
            max-width: 480px; 
        }

        h2 { 
            margin-top: 0;
            margin-bottom: 25px; 
            color: #081c3d; 
            text-align: center; 
            font-size: 1.8rem;
            font-weight: 800;
        }

        .grupo-campo { 
            margin-bottom: 18px; 
            display: flex; 
            flex-direction: column; 
        }

        label { 
            margin-bottom: 6px; 
            font-weight: 600; 
            color: #444; 
            font-size: 14px; 
        }

        input[type="text"], textarea, input[type="file"] { 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 10px; 
            font-size: 14px; 
            outline: none;
            background: #fff;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input[type="file"] {
            padding: 8px;
            background: #f8f9fa;
            cursor: pointer;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: #691eff;
            box-shadow: 0 0 0 3px rgba(105, 30, 255, 0.15);
        }

        textarea { 
            resize: vertical; 
            height: 90px; 
        }

        .btn-salvar { 
            background-color: #691eff; 
            color: white; 
            border: none; 
            padding: 14px; 
            border-radius: 12px; 
            font-weight: bold; 
            cursor: pointer; 
            width: 100%; 
            font-size: 16px; 
            margin-top: 10px; 
            transition: background 0.3s, transform 0.2s;
        }

        .btn-salvar:hover { 
            background-color: #5113d4; 
            transform: translateY(-2px);
        }

        .btn-cancelar { 
            display: block; 
            text-align: center; 
            margin-top: 18px; 
            color: #666; 
            text-decoration: none; 
            font-size: 14px; 
            font-weight: 600;
            transition: color 0.2s;
        }

        .btn-cancelar:hover {
            color: #081c3d;
            text-decoration: underline;
        }

        #statusText {
            text-align: center;
            color: #691eff;
            font-weight: bold;
            font-size: 14px;
            margin-top: 15px;
            min-height: 20px;
        }

        @media (max-width: 480px) {
            .container-editar {
                padding: 25px 20px;
            }

            h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="container-editar">
        <h2>Editar Perfil</h2>
        
        <form id="form-editar-perfil">
            <div class="grupo-campo">
                <label for="fotoCapa">Foto de Capa:</label>
                <input type="file" id="fotoCapa" accept="image/*">
            </div>

            <div class="grupo-campo">
                <label for="fotoPerfil">Foto de Perfil:</label>
                <input type="file" id="fotoPerfil" accept="image/*">
            </div>

            <div class="grupo-campo">
                <label for="nomeUsuario">Nome de Usuário:</label>
                <input type="text" id="nomeUsuario" placeholder="Seu nome" required>
            </div>

            <div class="grupo-campo">
                <label for="biografia">Biografia:</label>
                <textarea id="biografia" placeholder="Escreva uma breve descrição sobre você..."></textarea>
            </div>

            <div class="grupo-campo">
                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" placeholder="Ex: Mossoró">
            </div>

            <div class="grupo-campo">
                <label for="pais">País:</label>
                <input type="text" id="pais" placeholder="Ex: Brasil">
            </div>

            <div class="grupo-campo">
                <label for="instagram">Instagram:</label> 
                <input type="text" id="instagram" placeholder="@seuusuario">
            </div>

            <div class="grupo-campo">
                <label for="site">Website:</label>
                <input type="text" id="site" placeholder="https://seuwebsite.com">
            </div>

            <button type="submit" id="btnSalvar" class="btn-salvar">Salvar Alterações</button>
            <p id="statusText"></p>
            <a href="Perfil.html" class="btn-cancelar">Cancelar</a>
        </form>
    </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
 
<script>
  const SUPABASE_URL = 'https://zwgrjmsycbplokliovsg.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3Z3JqbXN5Y2JwbG9rbGlvdnNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzODM1OTEsImV4cCI6MjA5OTk1OTU5MX0.KIKQ9QjspCik0QY6TGoT_mHcsK3Y_IeXcmqUo0cVhw4'; 
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  document.addEventListener('DOMContentLoaded', async () => {

    const { data: { user }, error } = await supabaseClient.auth.getUser();
    if (!user) {
      window.location.href = 'Login.html';
      return;
    }

    const { data: perfil } = await supabaseClient
      .from('perfis')
      .select('*')
      .eq('id', user.id)
      .single();

    if (perfil) {
      document.getElementById('nomeUsuario').value = perfil.nome || '';
      document.getElementById('biografia').value = perfil.biografia || '';
      document.getElementById('cidade').value = perfil.cidade || '';
      document.getElementById('pais').value = perfil.pais || '';
      document.getElementById('instagram').value = perfil.instagram || '';
      document.getElementById('site').value = perfil.site || '';
    }

    document.getElementById('form-editar-perfil').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const statusText = document.getElementById('statusText');
      statusText.textContent = 'Salvando alterações...';
      statusText.style.color = '#691eff';

      let fotoPerfilUrl = perfil?.foto_perfil;
      let fotoCapaUrl = perfil?.foto_capa;

      const inputPerfil = document.getElementById('fotoPerfil');
      if (inputPerfil?.files[0]) {
        const file = inputPerfil.files[0];
        const fileName = `${user.id}_perfil_${Date.now()}`;
        const { error: uploadError } = await supabaseClient.storage.from('avatares').upload(fileName, file);
        if (!uploadError) {
          fotoPerfilUrl = supabaseClient.storage.from('avatares').getPublicUrl(fileName).data.publicUrl;
        } else {
          console.error("Erro upload Perfil:", uploadError);
        }
      }

      const inputCapa = document.getElementById('fotoCapa');
      if (inputCapa?.files[0]) {
        const file = inputCapa.files[0];
        const fileName = `${user.id}_capa_${Date.now()}`;
        const { error: uploadError } = await supabaseClient.storage.from('avatares').upload(fileName, file);
        if (!uploadError) {
          fotoCapaUrl = supabaseClient.storage.from('avatares').getPublicUrl(fileName).data.publicUrl;
        } else {
          console.error("Erro upload Capa:", uploadError);
        }
      }

      const { error: updateError } = await supabaseClient
        .from('perfis')
        .update({
          nome: document.getElementById('nomeUsuario').value,
          biografia: document.getElementById('biografia').value,
          cidade: document.getElementById('cidade').value,
          pais: document.getElementById('pais').value,
          instagram: document.getElementById('instagram').value,
          site: document.getElementById('site').value,
          foto_perfil: fotoPerfilUrl,
          foto_capa: fotoCapaUrl
        })
        .eq('id', user.id);

      if (updateError) {
        statusText.style.color = 'red';
        statusText.textContent = 'Erro ao atualizar perfil: ' + updateError.message;
      } else {
        statusText.style.color = 'green';
        statusText.textContent = 'Perfil atualizado com sucesso!';
        setTimeout(() => {
            window.location.href = 'Perfil.html';
        }, 1500);
      }
    });
  });
</script>

</body>
</html>
