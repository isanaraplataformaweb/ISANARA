<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicar Matéria - ISANARA</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #081c3d 0%, #691eff 45%, #71c6f1 100%);
            background-size: cover;
            background-attachment: fixed;
            color: white;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.35;
            z-index: -1;
        }

        body::before {
            width: 350px;
            height: 350px;
            background: #060238;
            top: -100px;
            left: -100px;
        }

        body::after {
            width: 400px;
            height: 400px;
            background: #7f02fb;
            bottom: -150px;
            right: -150px;
        }

        .container-publicar {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 440px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 24px;
            color: #f2e8fd;
            text-align: center;
            font-size: 1.8rem;
            font-weight: 800;
        }

        .grupo-campo {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 6px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
        }

        input[type="text"], textarea, input[type="file"] {
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
        }

        input[type="text"]::placeholder, textarea::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        input[type="file"] {
            padding: 10px;
            background: rgba(255, 255, 255, 0.08);
            cursor: pointer;
            color: rgba(255, 255, 255, 0.9);
        }

        input[type="file"]::file-selector-button {
            background: #691eff;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-right: 10px;
            transition: background 0.3s;
        }

        input[type="file"]::file-selector-button:hover {
            background: #5113d4;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: #b46cff;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 0 3px rgba(180, 108, 255, 0.25);
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        .btn-publicar {
            background-color: #691eff;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(105, 30, 255, 0.4);
            transition: background 0.3s, transform 0.2s, box-shadow 0.3s;
        }

        .btn-publicar:hover {
            background-color: #5113d4;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(105, 30, 255, 0.6);
        }

        .btn-publicar:disabled {
            background-color: rgba(105, 30, 255, 0.4);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-cancelar {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.2s;
        }

        .btn-cancelar:hover {
            color: white;
            text-decoration: underline;
        }

        #statusText {
            text-align: center;
            color: #ff6b6b;
            font-size: 14px;
            margin-bottom: 15px;
            min-height: 20px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container-publicar">
        <h2>Publicar Novo Aprendizado</h2>
        
        <form id="form-publicar-materia">
            <div class="grupo-campo">
                <label for="imagemMateria">Foto de Capa:</label>
                <input type="file" id="imagemMateria" name="imagemMateria" accept="image/*" required>
            </div>

            <div class="grupo-campo">
                <label for="tituloMateria">Título:</label>
                <input type="text" id="tituloMateria" name="tituloMateria" placeholder="Nomeie essa coletânea artística da sua maneira..." required>
            </div>

            <div class="grupo-campo">
                <label for="descricaoMateria">Descrição:</label>
                <textarea id="descricaoMateria" name="descricaoMateria" placeholder="Dê uma breve contextualização do seu material, conteúdo ou ofício..."></textarea>
            </div>

            <div class="grupo-campo">
                <label for="pdfMateria">Anexar Material (PDF):</label>
                <input type="file" id="pdfMateria" name="pdfMateria" accept=".pdf" required>
            </div>

            <p id="statusText"></p>

            <button type="submit" class="btn-publicar">Publicar Matéria</button>
            <a href="Opções-criar.html" class="btn-cancelar">Cancelar</a>
        </form>
    </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://zwgrjmsycbplokliovsg.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3Z3JqbXN5Y2JwbG9rbGlvdnNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzODM1OTEsImV4cCI6MjA5OTk1OTU5MX0.KIKQ9QjspCik0QY6TGoT_mHcsK3Y_IeXcmqUo0cVhw4'; 
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('form-publicar-materia').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const statusText = document.getElementById('statusText');
      statusText.textContent = 'Publicando matéria...';
      statusText.style.color = '#b46cff';

      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) {
        alert('Você precisa estar logado para publicar!');
        window.location.href = 'Login.html';
        return;
      }

      const titulo = document.getElementById('tituloMateria').value;
      const descricao = document.getElementById('descricaoMateria').value;
      
      const fileCapa = document.getElementById('imagemMateria').files[0];
      const filePdf = document.getElementById('pdfMateria').files[0];

      let capaUrl = null;
      let pdfUrl = null;

      if (fileCapa) {
        const fileNameCapa = `${user.id}_capa_${Date.now()}`;
        const { error: uploadCapaError } = await supabaseClient.storage.from('materias').upload(fileNameCapa, fileCapa);
        
        if (uploadCapaError) {
          statusText.style.color = '#ff6b6b';
          statusText.textContent = 'Erro no upload da capa: ' + uploadCapaError.message;
          return;
        }
        capaUrl = supabaseClient.storage.from('materias').getPublicUrl(fileNameCapa).data.publicUrl;
      }

      if (filePdf) {
        const fileNamePdf = `${user.id}_pdf_${Date.now()}.pdf`;
        const { error: uploadPdfError } = await supabaseClient.storage.from('materias').upload(fileNamePdf, filePdf);
        
        if (uploadPdfError) {
          statusText.style.color = '#ff6b6b';
          statusText.textContent = 'Erro no upload do PDF: ' + uploadPdfError.message;
          return;
        }
        pdfUrl = supabaseClient.storage.from('materias').getPublicUrl(fileNamePdf).data.publicUrl;
      }

      const { error: insertError } = await supabaseClient
        .from('materias')
        .insert([{
          user_id: user.id,
          titulo: titulo,
          descricao: descricao, 
          capa_url: capaUrl,
          pdf_url: pdfUrl       
        }]);

      if (insertError) {
        statusText.style.color = '#ff6b6b';
        statusText.textContent = 'Erro ao salvar matéria: ' + insertError.message;
      } else {
        statusText.style.color = '#51cf66';
        statusText.textContent = 'Matéria publicada com sucesso!';
        alert('Matéria publicada com sucesso!');
        window.location.href = 'Materias.html';
      }
    });
  });
</script>
</body>
</html>
