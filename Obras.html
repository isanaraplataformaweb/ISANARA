<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes das criações</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Segoe UI", sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        header {
            width: 100%;
            height: 80px;
            background: linear-gradient(135deg, #081c3d 0%, #1e5eff 45%, #b46cff 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            box-shadow: 0 3px 10px rgba(0,0,0,.08);
            position: sticky;
            top: 0;
            z-index: 999;
        }
        header img {
            height: 40px;
            width: auto;
            mix-blend-mode: screen;
            margin-left: 20px;
        }
        nav {
            display: flex;
            gap: 35px;
            margin: auto;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 18px;
            transition: .3s;
            position: relative;
        }
        nav a::after {
            content: "";
            position: absolute;
            width: 0%;
            height: 3px;
            left: 0;
            bottom: -5px;
            background: white;
            transition: .3s;
        }
        nav a:hover::after {
            width: 100%;
        }
        nav a.ativo {
            color: #ffffff;
        }
        nav a.ativo::after {
            content: "";
            width: 100%;
            height: 2px;
            background: #fbfbfb;
            position: absolute;
            left: 0;
            bottom: -10px;
            border-radius: 5px;
        }

        .container-obra {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 40px;
        }

        .visualizacao-arte {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,.05);
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000;
            height: fit-content;
        }
        .visualizacao-arte img {
            width: 100%;
            max-height: 700px;
            object-fit: contain;
        }

        .info-detalhes {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,.05);
            display: flex;
            flex-direction: column;
        }
        .bloco-texto h1 {
            font-size: 28px;
            color: #222;
            margin-bottom: 15px;
        }
        .bloco-texto .data-publicacao {
            font-size: 13px;
            color: #999;
            margin-bottom: 20px;
            display: block;
        }
        .bloco-texto .descricao-texto {
            font-size: 16px;
            line-height: 1.7;
            color: #555;
            margin-bottom: 30px;
        }

        .cartao-artista {
            border-top: 1px solid #eee;
            padding-top: 20px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .artista-info-esquerda {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            text-decoration: none;
        }
        .cartao-artista img {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #6c63ff;
        }
        .cartao-artista .meta-artista p {
            font-size: 13px;
            color: #888;
        }
        .cartao-artista .meta-artista h4 {
            font-size: 16px;
            color: #333;
        }

        .btn-seguir {
            background: #6c63ff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: .2s;
        }
        .btn-seguir:hover { background: #5148d7; }
        .btn-seguir.seguindo { background: #e0e0e0; color: #333; }

        .acoes-dono {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn-acao {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        .btn-editar { background-color: #ffc107; color: #333; }
        .btn-editar:hover { background-color: #e0a800; }
        .btn-excluir { background-color: #dc3545; color: white; }
        .btn-excluir:hover { background-color: #c82333; }

        .interacoes {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        .btn-interacao {
            background: #f1f3f5;
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            color: #444;
            transition: .2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-interacao:hover { background: #e2e6ea; }

        .secao-comentarios {
            border-top: 1px solid #eee;
            padding-top: 20px;
            margin-bottom: 30px;
            flex-grow: 1;
        }
        .secao-comentarios h3 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
        }
        .lista-comentarios {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .comentario-item {
            display: flex;
            gap: 10px;
            font-size: 14px;
        }
        .comentario-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: cover;
        }
        .form-comentario {
            display: flex;
            gap: 10px;
        }
        .form-comentario input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
        }
        .form-comentario button {
            background: #6c63ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-voltar {
            display: block;
            text-align: center;
            background: #333;
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 30px;
            font-weight: bold;
            transition: .3s;
            width: 100%;
            margin-top: auto;
        }
        .btn-voltar:hover { background: #111; }

        .status-mensagem {
            text-align: center;
            font-size: 18px;
            color: #777;
            padding: 100px 20px;
            grid-column: 1 / -1;
        }
        .escondido { display: none !important; }

        /* Modal de Edição */
        #modalEditarObra {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-conteudo {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
        }
        .grupo-modal {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        .grupo-modal label { margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #555; }
        .grupo-modal input, .grupo-modal textarea { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; }
        .grupo-modal textarea { resize: none; height: 80px; }

        @media(max-width: 800px) {
            .container-obra { grid-template-columns: 1fr; gap: 25px; margin: 20px auto; }
            header { flex-direction: column; gap: 20px; height: auto; padding: 15px 0; }
            nav { flex-wrap: wrap; justify-content: center; }
        }
    </style>
</head>
<body>
    <header>
        <a href="Index.html">
            <img src="1.png" alt="Logo">
        </a>
        <nav>
            <a href="Index.html">Início</a>
            <a href="Galeria.html" class="ativo">Galeria</a>
            <a href="Perfil.html">Perfil</a>
            <a href="Comunicações.html">Comunicações</a>
        </nav>
    </header>

    <p class="status-mensagem" id="mensagemStatus">Carregando detalhes da obra de arte...</p>
    
    <main class="container-obra escondido" id="conteudoObra">
        
        <div class="visualizacao-arte">
            <img id="imgObra" src="" alt="Arte">
        </div>

        <div class="info-detalhes">
            <!-- Botões de Edição/Exclusão para o Dono -->
            <div id="acoesDonoContainer" class="acoes-dono escondido">
                <button class="btn-acao btn-editar" id="btnEditarObraModal">Editar Obra</button>
                <button class="btn-acao btn-excluir" id="btnExcluirObra">Excluir Obra</button>
            </div>

            <div class="bloco-texto">
                <h1 id="tituloObra">Título da Obra</h1>
                <span class="data-publicacao" id="dataObra">Publicado em: --/--/----</span>
                <p class="descricao-texto" id="descricaoObra">Descrição detalhada...</p>
            </div>
            
            <div class="cartao-artista">
                <a id="linkPerfilArtista" href="#" class="artista-info-esquerda">
                    <img id="avatarArtista" src="https://via.placeholder.com/50" alt="Avatar">
                    <div class="meta-artista">
                        <p>Artista Criador</p>
                        <h4 id="nomeArtista">Nome do Artista</h4>
                    </div>
                </a>
                <button id="btnSeguirArtista" class="btn-seguir escondido">Seguir</button>
            </div>

            <div class="interacoes">
                <button id="btnCurtir" class="btn-interacao">❤️ <span id="curtidasCount">0</span></button>
                <button id="btnCompartilhar" class="btn-interacao">🔗 Compartilhar</button>
            </div>

            <div class="secao-comentarios">
                <h3>Comentários</h3>
                <div id="comentariosContainer" class="lista-comentarios"></div>
                <form id="formComentario" class="form-comentario">
                    <input type="text" id="inputComentario" placeholder="Adicione um comentário..." autocomplete="off" required>
                    <button type="submit">Enviar</button>
                </form>
            </div>

            <a href="Galeria.html" class="btn-voltar">Voltar para a Galeria</a>
        </div>
    </main>

    <!-- Modal de Edição da Obra -->
    <div id="modalEditarObra">
        <div class="modal-conteudo">
            <h2 style="margin-bottom: 20px; font-size: 20px;">Editar Obra</h2>
            <form id="formEditarObra">
                <div class="grupo-modal">
                    <label>Título:</label>
                    <input type="text" id="editTituloObra" required>
                </div>
                <div class="grupo-modal">
                    <label>Descrição:</label>
                    <textarea id="editDescricaoObra"></textarea>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit" style="background:#6c63ff; color:white; border:none; padding:10px; border-radius:6px; flex:1; cursor:pointer; font-weight:bold;">Salvar</button>
                    <button type="button" id="fecharModalObra" style="background:#ccc; color:#333; border:none; padding:10px; border-radius:6px; flex:1; cursor:pointer; font-weight:bold;">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://zwgrjmsycbplokliovsg.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3Z3JqbXN5Y2JwbG9rbGlvdnNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzODM1OTEsImV4cCI6MjA5OTk1OTU5MX0.KIKQ9QjspCik0QY6TGoT_mHcsK3Y_IeXcmqUo0cVhw4'; 
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const urlParams = new URLSearchParams(window.location.search);
  const obraId = urlParams.get('id');

  document.addEventListener('DOMContentLoaded', async () => {
    if (!obraId) {
      alert('Obra não encontrada!');
      window.location.href = 'Galeria.html';
      return;
    }

    const { data: { user } } = await supabaseClient.auth.getUser();

    const { data: obra, error } = await supabaseClient
      .from('obras')
      .select('*, perfis(id, nome, foto_perfil)')
      .eq('id', obraId)
      .single();

    if (error || !obra) {
      document.getElementById('mensagemStatus').textContent = 'Erro ao carregar detalhes da obra.';
      return;
    }

    // Preenchendo dados na tela
    document.getElementById('tituloObra').textContent = obra.titulo;
    document.getElementById('descricaoObra').textContent = obra.descricao || 'Sem descrição.';
    document.getElementById('imgObra').src = obra.imagem_url;
    document.getElementById('nomeArtista').textContent = obra.perfis?.nome || 'Artista Anônimo';
    document.getElementById('avatarArtista').src = obra.perfis?.foto_perfil || 'https://via.placeholder.com/50';
    
    if (obra.perfis?.id) {
      document.getElementById('linkPerfilArtista').href = `Perfil-Publico.html?id=${obra.perfis.id}`;
    }

    if (obra.created_at) {
        const dataFormatada = new Date(obra.created_at).toLocaleDateString('pt-BR');
        document.getElementById('dataObra').textContent = `Publicado em: ${dataFormatada}`;
    }

    // Verificar se o usuário logado é o dono da obra para mostrar Editar/Excluir
    if (user && user.id === obra.user_id) {
      document.getElementById('acoesDonoContainer').classList.remove('escondido');
    }

    // Verificar sistema de Seguir perfil do autor
    if (user && obra.perfis?.id && user.id !== obra.perfis.id) {
      const btnSeguir = document.getElementById('btnSeguirArtista');
      btnSeguir.classList.remove('escondido');

      // Checar se já segue
      const { data: seguidorExistente } = await supabaseClient
        .from('seguidores')
        .select('id')
        .eq('seguidor_id', user.id)
        .eq('seguido_id', obra.perfis.id)
        .maybeSingle();

      if (seguidorExistente) {
        btnSeguir.textContent = 'Seguindo';
        btnSeguir.classList.add('seguindo');
      }

      btnSeguir.addEventListener('click', async () => {
        if (btnSeguir.textContent === 'Seguir') {
          await supabaseClient.from('seguidores').insert([{ seguidor_id: user.id, seguido_id: obra.perfis.id }]);
          btnSeguir.textContent = 'Seguindo';
          btnSeguir.classList.add('seguindo');
        } else {
          await supabaseClient.from('seguidores').delete().eq('seguidor_id', user.id).eq('seguido_id', obra.perfis.id);
          btnSeguir.textContent = 'Seguir';
          btnSeguir.classList.remove('seguindo');
        }
      });
    }

    document.getElementById('mensagemStatus').classList.add('escondido');
    document.getElementById('conteudoObra').classList.remove('escondido');

    // Funcionalidade de Edição
    document.getElementById('btnEditarObraModal').addEventListener('click', () => {
      document.getElementById('editTituloObra').value = obra.titulo;
      document.getElementById('editDescricaoObra').value = obra.descricao || '';
      document.getElementById('modalEditarObra').style.display = 'flex';
    });

    document.getElementById('fecharModalObra').addEventListener('click', () => {
      document.getElementById('modalEditarObra').style.display = 'none';
    });

    document.getElementById('formEditarObra').addEventListener('submit', async (e) => {
      e.preventDefault();
      const novoTitulo = document.getElementById('editTituloObra').value;
      const novaDescricao = document.getElementById('editDescricaoObra').value;

      const { error: errUpdate } = await supabaseClient
        .from('obras')
        .update({ titulo: novoTitulo, descricao: novaDescricao })
        .eq('id', obraId);

      if (errUpdate) {
        alert('Erro ao atualizar obra: ' + errUpdate.message);
      } else {
        alert('Obra atualizada com sucesso!');
        window.location.reload();
      }
    });

    // Funcionalidade de Exclusão
    document.getElementById('btnExcluirObra').addEventListener('click', async () => {
      if (!confirm('Tem certeza que deseja excluir esta obra permanentemente?')) return;

      if (obra.imagem_url) {
        try {
          const partesUrl = obra.imagem_url.split('/');
          const nomeArquivo = partesUrl[partesUrl.length - 1];
          await supabaseClient.storage.from('obras').remove([nomeArquivo]);
        } catch (err) {
          console.error('Erro ao excluir imagem do storage:', err);
        }
      }

      const { error: errDel } = await supabaseClient.from('obras').delete().eq('id', obraId);
      if (errDel) {
        alert('Erro ao excluir obra: ' + errDel.message);
      } else {
        alert('Obra excluída com sucesso!');
        window.location.href = 'Galeria.html';
      }
    });

    atualizarCurtidas();
    const btnCurtir = document.getElementById('btnCurtir');
    if (btnCurtir) {
      btnCurtir.addEventListener('click', async () => {
        if (!user) return alert('Faça login para curtir!');
        
        const { data: existente } = await supabaseClient
          .from('curtidas')
          .select('id')
          .eq('user_id', user.id)
          .eq('obra_id', obraId)
          .maybeSingle();

        if (existente) {
          await supabaseClient.from('curtidas').delete().eq('id', existente.id);
        } else {
          await supabaseClient.from('curtidas').insert([{ user_id: user.id, obra_id: obraId }]);
        }
        atualizarCurtidas();
      });
    }

    carregarComentarios();
    const formComentario = document.getElementById('formComentario');
    if (formComentario) {
      formComentario.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!user) return alert('Faça login para comentar!');
        
        const inputComentario = document.getElementById('inputComentario');
        const conteudo = inputComentario.value.trim();
        if (!conteudo) return;

        await supabaseClient.from('comentarios').insert([{
          user_id: user.id,
          obra_id: obraId,
          conteudo: conteudo
        }]);

        inputComentario.value = '';
        carregarComentarios();
      });
    }

    const btnCompartilhar = document.getElementById('btnCompartilhar');
    if (btnCompartilhar) {
      btnCompartilhar.addEventListener('click', async () => {
        navigator.clipboard.writeText(window.location.href);
        alert('Link da obra copiado!');
      });
    }
  });

  async function atualizarCurtidas() {
    const { count } = await supabaseClient
      .from('curtidas')
      .select('id', { count: 'exact' })
      .eq('obra_id', obraId);
    
    const countSpan = document.getElementById('curtidasCount');
    if (countSpan) countSpan.textContent = count || 0;
  }

  async function carregarComentarios() {
    const comentariosContainer = document.getElementById('comentariosContainer');
    if (!comentariosContainer) return;

    const { data: comentarios } = await supabaseClient
      .from('comentarios')
      .select('*, perfis(nome, foto_perfil)')
      .eq('obra_id', obraId)
      .order('created_at', { ascending: true });

    comentariosContainer.innerHTML = '';
    
    if (comentarios && comentarios.length > 0) {
        comentarios.forEach(c => {
          comentariosContainer.innerHTML += `
            <div class="comentario-item">
              <img src="${c.perfis?.foto_perfil || 'https://via.placeholder.com/30'}" class="comentario-avatar">
              <div>
                <strong>${c.perfis?.nome || 'Usuário'}:</strong>
                <span>${c.conteudo}</span>
              </div>
            </div>
          `;
        });
    } else {
        comentariosContainer.innerHTML = '<p style="color: #999; font-size: 14px;">Seja o primeiro a comentar.</p>';
    }
  }
</script>

</body>
</html>
