<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criação</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", sans-serif;
            background: #f5f7fa;
            color: #333;
        }
        .container-conteudo {
            display: flex;
            justify-content: center;  
            align-items: center;       
            min-height: calc(100vh - 80px); 
            width: 100%;
            padding: 20px;            
        }

        .card {
            display: flex; 
            flex-direction: column; 
            gap: 30px; 
            width: 450px; 
            min-height: 400px;
            background: white;
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.137);
            transition: .3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .acoes {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .btn-editar {
            background: #6c63ff;
            color: white;
            text-decoration: none;
            padding: 15px 40px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: bold;
            transition: .3s;
        }

        .btn-editar:hover {
            background: #5148d7;
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
   .card {
        width: 100%;
        max-width: 100%;
    }
   .btn-editar {
         width: 100%;
         padding: 12px 20px;
         font-size: 16px;
   }

    </style>
    <link rel="stylesheet" href="nav.css">
</head>

<body>
    <!-- BOTÃO DE CRIAÇÃO (+) - EXIBIDO APENAS SE ESTIVER LOGADO -->
    <a href="Opções-criar.html" id="fabCriar" class="btn-criar-fab" aria-label="Criar novo conteúdo" title="Criar">

            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
    </a>

    </nav>

    <main class="container-conteudo">
        <div class="card">
            <h2>Espaço de Criação</h2>
            <p>Aqui você pode escolher entre publicar uma obra, divulgar um evento ou compartilhar oficinas e aprendizados.</p>

            <a href="Postar-Obra.html" class="btn-editar"> Postar Obra </a>
            <a href="Postar-evento.html" class="btn-editar"> Postar Evento </a>
            <a href="Postar-Matéria.html" class="btn-editar"> Postar Matéria </a>
